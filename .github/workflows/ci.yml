# CI — runs on every push to main and every pull request.
# If any step fails, the PR shows a red ✗ and you know before Reddit does.
#
# Analogy: the tech rehearsal before opening night. Every light cue and sound
# cue runs once, start to finish, on a stage that isn't your laptop.
#
# Security hygiene used here:
#   - Actions pinned to full commit SHAs (a moved tag can't swap in new code).
#     Dependabot bumps the SHA + version comment for you.
#   - `permissions: contents: read` — the job's token can't push or comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs exactly what's in package-lock.json — no surprise upgrades.
      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Typecheck
        run: npm run test:types

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm run test:unit

      - name: Build (art pipeline + Vite client & server)
        run: npm run build

      - name: Bundle size report
        run: |
          {
            echo "### 📦 Bundle size"
            echo '```'
            du -sh dist/client dist/server
            echo '--- largest client files ---'
            find dist/client -type f -printf '%s\t%P\n' | sort -nr | head -10 | numfmt --to=iec --field=1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Space Blaster 2 lives in its own folder with its own lockfile and toolchain.
  # GitHub only reads workflows from the repo root, so the copy inside
  # retro-space-blaster-2/.github/ never runs; this job is what actually guards it.
  # Analogy: a second stage in the same theatre needs its own tech rehearsal.
  check-sequel:
    name: Space Blaster 2 · Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: retro-space-blaster-2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js (version from the sequel's .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: retro-space-blaster-2/.nvmrc
          cache: npm
          cache-dependency-path: retro-space-blaster-2/package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Typecheck, lint, formatting and unit tests
        run: npm run check

      - name: Build (art pipeline + Vite client & server)
        run: npm run build
